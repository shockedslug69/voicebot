<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hindi + Telugu Voice Bot</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Noto+Sans+Devanagari:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d14;
    --surface: #16161f;
    --surface2: #1e1e2e;
    --border: #2a2a3e;
    --accent: #ff5c5c;
    --accent2: #ffa040;
    --accent3: #7c6fff;
    --text: #f0eeff;
    --muted: #7a7a99;
    --user-bubble: #1e2a4a;
    --bot-bubble: #1e1e2e;
    --glow: 0 0 24px rgba(255,92,92,0.25);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Baloo 2', cursive;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: 
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(124,111,255,0.08) 0%, transparent 60%),
      radial-gradient(ellipse 50% 40% at 80% 80%, rgba(255,92,92,0.07) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    width: 100%;
    max-width: 680px;
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: relative;
    z-index: 1;
  }

  /* Header */
  header {
    padding: 18px 20px 12px;
    border-bottom: 1px solid var(--border);
    background: rgba(13,13,20,0.9);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-inner {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .bot-avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent) 0%, var(--accent3) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    box-shadow: var(--glow);
    animation: pulse-avatar 3s ease-in-out infinite;
  }

  @keyframes pulse-avatar {
    0%, 100% { box-shadow: 0 0 16px rgba(255,92,92,0.3); }
    50% { box-shadow: 0 0 32px rgba(255,92,92,0.6); }
  }

  .bot-info h1 {
    font-size: 16px;
    font-weight: 800;
    letter-spacing: 0.3px;
    color: var(--text);
  }

  .bot-info .subtitle {
    font-size: 11px;
    color: var(--muted);
    font-weight: 400;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #4cff91;
    display: inline-block;
    margin-right: 5px;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  .header-actions {
    margin-left: auto;
    display: flex;
    gap: 8px;
  }

  .icon-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--muted);
    width: 34px; height: 34px;
    border-radius: 8px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    transition: all 0.2s;
  }

  .icon-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: rgba(255,92,92,0.08);
  }

  /* Live transcript banner */
  .transcript-banner {
    background: rgba(124,111,255,0.08);
    border-bottom: 1px solid rgba(124,111,255,0.2);
    padding: 8px 20px;
    font-size: 13px;
    color: var(--accent3);
    min-height: 34px;
    display: flex;
    align-items: center;
    gap: 8px;
    transition: all 0.3s;
  }

  .transcript-banner.hidden { display: none; }

  .transcript-banner .mic-icon {
    font-size: 16px;
    animation: mic-pulse 0.8s ease-in-out infinite;
  }

  @keyframes mic-pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.2); }
  }

  #live-transcript {
    font-style: italic;
    flex: 1;
    color: #b8b0ff;
  }

  /* Chat area */
  .chat-area {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .chat-area::-webkit-scrollbar { width: 4px; }
  .chat-area::-webkit-scrollbar-track { background: transparent; }
  .chat-area::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* Welcome message */
  .welcome {
    text-align: center;
    padding: 32px 16px;
    animation: fadeIn 0.6s ease;
  }

  .welcome .wave { font-size: 48px; animation: wave 2s ease-in-out infinite; display: inline-block; }
  @keyframes wave {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(20deg); }
    75% { transform: rotate(-10deg); }
  }

  .welcome h2 { font-size: 22px; font-weight: 800; margin: 12px 0 6px; }
  .welcome p { color: var(--muted); font-size: 14px; line-height: 1.6; }

  .language-chips {
    display: flex;
    gap: 8px;
    justify-content: center;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  .chip {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 5px 14px;
    font-size: 12px;
    color: var(--muted);
  }

  /* Chat bubbles */
  .message {
    display: flex;
    gap: 8px;
    animation: slideIn 0.3s ease;
    max-width: 88%;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .message.user { align-self: flex-end; flex-direction: row-reverse; }
  .message.bot { align-self: flex-start; }

  .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .message.user .msg-avatar {
    background: linear-gradient(135deg, #2a4a8a, #1e3060);
  }

  .message.bot .msg-avatar {
    background: linear-gradient(135deg, var(--accent), var(--accent3));
  }

  .bubble {
    padding: 10px 14px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 100%;
    word-break: break-word;
  }

  .message.user .bubble {
    background: var(--user-bubble);
    border: 1px solid rgba(124,111,255,0.2);
    border-top-right-radius: 4px;
    color: #cde;
  }

  .message.bot .bubble {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-top-left-radius: 4px;
  }

  .bubble .timestamp {
    font-size: 10px;
    color: var(--muted);
    margin-top: 4px;
    display: block;
  }

  .bubble .play-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--accent2);
    border-radius: 6px;
    padding: 3px 10px;
    font-size: 11px;
    cursor: pointer;
    margin-top: 6px;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
    font-family: inherit;
  }

  .bubble .play-btn:hover {
    background: rgba(255,160,64,0.1);
    border-color: var(--accent2);
  }

  /* Typing indicator */
  .typing-indicator {
    display: flex;
    gap: 8px;
    align-self: flex-start;
    animation: fadeIn 0.3s ease;
  }

  .typing-indicator .msg-avatar {
    width: 30px; height: 30px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  .typing-dots {
    background: var(--bot-bubble);
    border: 1px solid var(--border);
    border-radius: 16px;
    border-top-left-radius: 4px;
    padding: 12px 16px;
    display: flex;
    gap: 5px;
    align-items: center;
  }

  .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--muted);
    animation: dotBounce 1.2s ease-in-out infinite;
  }
  .dot:nth-child(2) { animation-delay: 0.2s; }
  .dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes dotBounce {
    0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
    40% { transform: translateY(-6px); opacity: 1; }
  }

  /* Input area */
  .input-area {
    padding: 12px 16px 16px;
    border-top: 1px solid var(--border);
    background: rgba(13,13,20,0.95);
    backdrop-filter: blur(12px);
  }

  .input-row {
    display: flex;
    gap: 10px;
    align-items: flex-end;
  }

  .text-input-wrap {
    flex: 1;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 14px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    transition: border-color 0.2s;
  }

  .text-input-wrap:focus-within {
    border-color: var(--accent3);
    box-shadow: 0 0 0 3px rgba(124,111,255,0.1);
  }

  #text-input {
    flex: 1;
    background: none;
    border: none;
    outline: none;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    padding: 12px 0;
    resize: none;
  }

  #text-input::placeholder { color: var(--muted); }

  .send-btn {
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    border: none;
    color: white;
    width: 44px; height: 44px;
    border-radius: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    transition: all 0.2s;
    flex-shrink: 0;
  }

  .send-btn:hover { transform: scale(1.05); box-shadow: var(--glow); }
  .send-btn:active { transform: scale(0.97); }

  /* MIC BUTTON */
  .mic-btn {
    width: 44px; height: 44px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface2);
    color: var(--muted);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    transition: all 0.2s;
    flex-shrink: 0;
    position: relative;
  }

  .mic-btn:hover { border-color: var(--accent); color: var(--accent); }

  .mic-btn.listening {
    background: rgba(255,92,92,0.15);
    border-color: var(--accent);
    color: var(--accent);
    animation: mic-glow 1s ease-in-out infinite;
  }

  @keyframes mic-glow {
    0%, 100% { box-shadow: 0 0 8px rgba(255,92,92,0.3); }
    50% { box-shadow: 0 0 20px rgba(255,92,92,0.7); }
  }

  .mic-btn.listening::after {
    content: '';
    position: absolute;
    inset: -4px;
    border-radius: 16px;
    border: 2px solid var(--accent);
    animation: ripple-out 1s ease-out infinite;
  }

  @keyframes ripple-out {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(1.6); }
  }

  /* Log panel */
  .log-panel {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    z-index: 100;
    align-items: center;
    justify-content: center;
    padding: 20px;
    backdrop-filter: blur(4px);
    animation: fadeIn 0.2s ease;
  }

  .log-panel.open { display: flex; }

  .log-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px;
    width: 100%;
    max-width: 540px;
    max-height: 80vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .log-header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-weight: 700;
    font-size: 15px;
  }

  .log-content {
    flex: 1;
    overflow-y: auto;
    padding: 16px 20px;
    font-size: 13px;
    line-height: 1.8;
    color: #aaa;
    white-space: pre-wrap;
    font-family: 'Courier New', monospace;
  }

  .log-footer {
    padding: 12px 20px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 10px;
  }

  .btn-secondary {
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 9px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-secondary:hover { border-color: var(--accent3); color: var(--accent3); }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent), var(--accent3));
    border: none;
    color: white;
    padding: 9px 18px;
    border-radius: 10px;
    cursor: pointer;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    transition: all 0.2s;
  }

  .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }

  /* Toast */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--surface2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 20px;
    border-radius: 30px;
    font-size: 13px;
    z-index: 200;
    opacity: 0;
    transition: all 0.3s;
    pointer-events: none;
    white-space: nowrap;
  }

  .toast.show {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* Mobile friendly */
  @media (max-width: 480px) {
    .chat-area { padding: 14px 10px; }
    .input-area { padding: 10px 10px 14px; }
    .welcome h2 { font-size: 18px; }
    .welcome .wave { font-size: 36px; }
  }
</style>
</head>
<body>

<div class="container">
  <!-- Header -->
  <header>
    <div class="header-inner">
      <div class="bot-avatar">🤖</div>
      <div class="bot-info">
        <h1>VoiceBot — हिंदी + తెలుగు</h1>
        <div class="subtitle"><span class="status-dot"></span>Online · Mixed Language Support</div>
      </div>
      <div class="header-actions">
        <button class="icon-btn" onclick="openLogs()" title="View conversation logs">📋</button>
        <button class="icon-btn" onclick="clearChat()" title="Clear chat">🗑️</button>
      </div>
    </div>
  </header>

  <!-- Live Transcript Banner -->
  <div class="transcript-banner hidden" id="transcript-banner">
    <span class="mic-icon">🎙️</span>
    <span id="live-transcript">Listening...</span>
  </div>

  <!-- Chat Area -->
  <div class="chat-area" id="chat-area">
    <div class="welcome" id="welcome-msg">
      <span class="wave">👋</span>
      <h2>Namaste! నమస్కారం!</h2>
      <p>Mic press karke boliye ya type kariye<br>Hindi + Telugu mix mein baat kar sakte hain!</p>
      <div class="language-chips">
        <span class="chip">🇮🇳 Hindi</span>
        <span class="chip">🌊 Telugu</span>
        <span class="chip">🔀 Mixed</span>
        <span class="chip">🎤 Voice Input</span>
      </div>
    </div>
  </div>

  <!-- Input Area -->
  <div class="input-area">
    <div class="input-row">
      <button class="mic-btn" id="mic-btn" onclick="toggleMic()" title="Start/Stop voice input">
        🎤
      </button>
      <div class="text-input-wrap">
        <input type="text" id="text-input" placeholder="Type in Hindi, Telugu, or both..." 
               onkeydown="if(event.key==='Enter') sendMessage()">
      </div>
      <button class="send-btn" onclick="sendMessage()" title="Send message">➤</button>
    </div>
  </div>
</div>

<!-- Log Panel -->
<div class="log-panel" id="log-panel">
  <div class="log-box">
    <div class="log-header">
      <span>📋 Conversation Logs</span>
      <button class="icon-btn" onclick="closeLogs()">✕</button>
    </div>
    <div class="log-content" id="log-content">No conversation yet.</div>
    <div class="log-footer">
      <button class="btn-secondary" onclick="closeLogs()">Close</button>
      <button class="btn-primary" onclick="downloadLog('txt')">⬇ Download .txt</button>
      <button class="btn-primary" onclick="downloadLog('json')">⬇ Download .json</button>
    </div>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ============================================================
//  STATE
// ============================================================
let conversationLog = [];       // { role, text, time }
let recognition = null;
let isListening = false;
let speechSynthesis = window.speechSynthesis;
let currentUtterance = null;

// ============================================================
//  SPEECH RECOGNITION (STT)
// ============================================================
function initSpeechRecognition() {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition) {
    showToast("⚠️ Speech recognition not supported. Use Chrome.");
    return null;
  }
  const r = new SpeechRecognition();
  r.continuous = false;
  r.interimResults = true;
  // Use Hindi (also picks up a lot of Telugu in mixed mode)
  r.lang = 'hi-IN';

  r.onstart = () => {
    document.getElementById('transcript-banner').classList.remove('hidden');
    document.getElementById('live-transcript').textContent = 'Sun raha hoon... (listening)';
  };

  r.onresult = (e) => {
    let interim = '', final = '';
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) final += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    document.getElementById('live-transcript').textContent = final || interim || 'Listening...';
    if (final) {
      document.getElementById('text-input').value = final;
    }
  };

  r.onerror = (e) => {
    stopListening();
    if (e.error === 'not-allowed') showToast("❌ Microphone access denied.");
    else if (e.error === 'no-speech') showToast("🔇 No speech detected. Try again.");
    else showToast("⚠️ STT error: " + e.error);
  };

  r.onend = () => {
    stopListening();
    const val = document.getElementById('text-input').value.trim();
    if (val) sendMessage();
  };

  return r;
}

function toggleMic() {
  if (isListening) {
    recognition && recognition.stop();
    stopListening();
  } else {
    recognition = initSpeechRecognition();
    if (!recognition) return;
    try {
      recognition.start();
      isListening = true;
      document.getElementById('mic-btn').classList.add('listening');
      document.getElementById('mic-btn').innerHTML = '⏹️';
    } catch(e) {
      showToast("Mic error: " + e.message);
    }
  }
}

function stopListening() {
  isListening = false;
  const btn = document.getElementById('mic-btn');
  btn.classList.remove('listening');
  btn.innerHTML = '🎤';
  document.getElementById('transcript-banner').classList.add('hidden');
}

// ============================================================
//  TEXT TO SPEECH (TTS)
// ============================================================
function speak(text) {
  if (!speechSynthesis) return;
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  // Try Hindi voice first, fall back gracefully
  const voices = speechSynthesis.getVoices();
  const hiVoice = voices.find(v => v.lang === 'hi-IN') ||
                  voices.find(v => v.lang.startsWith('hi')) ||
                  voices.find(v => v.lang === 'te-IN') ||
                  null;
  if (hiVoice) utter.voice = hiVoice;
  utter.lang = 'hi-IN';
  utter.rate = 0.92;
  utter.pitch = 1.05;
  currentUtterance = utter;
  speechSynthesis.speak(utter);
}

// ============================================================
//  BOT RESPONSE LOGIC (AI-powered via Claude API)
// ============================================================
async function getBotResponse(userText) {
  const systemPrompt = `You are a friendly bilingual voice bot for Sankar Group that speaks in a natural mix of Hindi and Telugu (Hinglish-Telugu style), similar to how people in Hyderabad speak.

IMPORTANT RULES:
1. Always respond in a natural mix of Hindi and Telugu. Example style: "Namaste! Aapko kaise help kar sakta hoon? Meeru demo kavali ante, main schedule karta hoon."
2. Keep responses SHORT (1-3 sentences) since this is voice output.
3. Use ROMANIZED script (not Devanagari or Telugu script) so TTS can read it aloud.
4. Be warm, helpful, and conversational.
5. Handle topics like: greetings, name introductions, software demo requests, help requests, appointment scheduling, product inquiries.
6. If user says their name, remember it and use it in the response.
7. Mix both languages naturally - some words in Hindi, some in Telugu.

Common Telugu words to use naturally:
- meeru/meeku = you/your
- kavali = needed/want  
- chestanu = will do
- ayindi = done
- manchidi = good
- dhanyavaadalu = thank you
- naa peru = my name is
- ela unnaru = how are you

Common Hindi words:
- aapko = to you
- chahiye = needed
- karenge = will do
- bilkul = absolutely
- zaroor = definitely
- kaise = how`;

  try {
    const response = await fetch("https://api.anthropic.com/v1/messages", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        model: "claude-sonnet-4-20250514",
        max_tokens: 1000,
        system: systemPrompt,
        messages: buildMessagesHistory(userText)
      })
    });
    const data = await response.json();
    if (data.content && data.content[0]) {
      return data.content[0].text;
    }
    throw new Error("No response");
  } catch (e) {
    // Fallback rule-based responses if API fails
    return getFallbackResponse(userText);
  }
}

function buildMessagesHistory(newUserText) {
  // Build last 10 turns for context
  const msgs = [];
  const history = conversationLog.slice(-10);
  for (const entry of history) {
    msgs.push({ role: entry.role === 'User' ? 'user' : 'assistant', content: entry.text });
  }
  msgs.push({ role: 'user', content: newUserText });
  return msgs;
}

// Fallback rule-based responses
function getFallbackResponse(text) {
  const t = text.toLowerCase();
  if (t.match(/namaste|hello|hi |helo|namaskar|నమస్కారం/)) 
    return "Namaste! Aapko kaise help kar sakta hoon? Meeku enti kavali?";
  if (t.match(/name|peru|naam|నా పేరు/)) 
    return "Shukriya apna naam batane ke liye! Aapki kaise madad kar sakta hoon?";
  if (t.match(/demo|డెమో/))
    return "Bilkul! Meeku demo schedule chestanu. Aapka preferred time kya hai?";
  if (t.match(/help|సహాయం|madad/))
    return "Zaroor! Aapko kis cheez mein help chahiye? Meeru help chestanu.";
  if (t.match(/price|cost|kitna|ధర/))
    return "Pricing ke baare mein, meeru details share chestanu. Ek minute please.";
  if (t.match(/bye|goodbye|alvida|సెలవు/))
    return "Dhanyavaadalu! Meeku phir se zarurat ho toh call karein. Alvida!";
  if (t.match(/thank|shukriya|dhanyavaad|ధన్యవాదాలు/))
    return "Aapka swagat hai! Koi aur help chahiye toh batayein. Meeru ikkade unnanu!";
  return "Samajh gaya! Aapki request process kar raha hoon. Ek second meeru check chestanu.";
}

// ============================================================
//  CHAT UI
// ============================================================
function sendMessage() {
  const input = document.getElementById('text-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  // Hide welcome
  const welcome = document.getElementById('welcome-msg');
  if (welcome) welcome.style.display = 'none';

  // Add user message
  addMessage('User', text);

  // Show typing indicator
  const typingId = showTyping();

  // Get bot response
  getBotResponse(text).then(response => {
    removeTyping(typingId);
    addMessage('Bot', response, true);
  });
}

function addMessage(role, text, autoSpeak = false) {
  const time = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
  
  // Log
  conversationLog.push({ role, text, time });

  const chatArea = document.getElementById('chat-area');
  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${role === 'User' ? 'user' : 'bot'}`;

  const avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  avatar.textContent = role === 'User' ? '👤' : '🤖';

  const bubble = document.createElement('div');
  bubble.className = 'bubble';

  const msgText = document.createElement('span');
  msgText.textContent = text;
  bubble.appendChild(msgText);

  const ts = document.createElement('span');
  ts.className = 'timestamp';
  ts.textContent = time;
  bubble.appendChild(ts);

  if (role === 'Bot') {
    const playBtn = document.createElement('button');
    playBtn.className = 'play-btn';
    playBtn.innerHTML = '▶ Play';
    playBtn.onclick = () => { speak(text); playBtn.innerHTML = '🔊 Playing...'; setTimeout(() => playBtn.innerHTML = '▶ Play', 3000); };
    bubble.appendChild(playBtn);
    if (autoSpeak) speak(text);
  }

  msgDiv.appendChild(avatar);
  msgDiv.appendChild(bubble);
  chatArea.appendChild(msgDiv);
  chatArea.scrollTop = chatArea.scrollHeight;
}

let typingCounter = 0;
function showTyping() {
  const id = 'typing-' + (++typingCounter);
  const chatArea = document.getElementById('chat-area');
  const div = document.createElement('div');
  div.className = 'typing-indicator';
  div.id = id;
  div.innerHTML = `<div class="msg-avatar">🤖</div><div class="typing-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>`;
  chatArea.appendChild(div);
  chatArea.scrollTop = chatArea.scrollHeight;
  return id;
}

function removeTyping(id) {
  const el = document.getElementById(id);
  if (el) el.remove();
}

function clearChat() {
  if (!conversationLog.length || confirm('Clear all messages?')) {
    conversationLog = [];
    const chatArea = document.getElementById('chat-area');
    chatArea.innerHTML = `
      <div class="welcome" id="welcome-msg">
        <span class="wave">👋</span>
        <h2>Namaste! నమస్కారం!</h2>
        <p>Mic press karke boliye ya type kariye<br>Hindi + Telugu mix mein baat kar sakte hain!</p>
        <div class="language-chips">
          <span class="chip">🇮🇳 Hindi</span>
          <span class="chip">🌊 Telugu</span>
          <span class="chip">🔀 Mixed</span>
          <span class="chip">🎤 Voice Input</span>
        </div>
      </div>`;
    showToast("Chat cleared ✓");
  }
}

// ============================================================
//  LOGS
// ============================================================
function openLogs() {
  const content = document.getElementById('log-content');
  if (!conversationLog.length) {
    content.textContent = 'No conversation yet.';
  } else {
    content.textContent = conversationLog.map(e => `[${e.time}] ${e.role}: ${e.text}`).join('\n');
  }
  document.getElementById('log-panel').classList.add('open');
}

function closeLogs() {
  document.getElementById('log-panel').classList.remove('open');
}

function downloadLog(format) {
  if (!conversationLog.length) { showToast("No conversation to download"); return; }
  let content, filename, type;
  if (format === 'json') {
    content = JSON.stringify({ conversation: conversationLog, exported: new Date().toISOString() }, null, 2);
    filename = 'conversation_log.json';
    type = 'application/json';
  } else {
    content = conversationLog.map(e => `[${e.time}] ${e.role}: ${e.text}`).join('\n');
    filename = 'conversation_log.txt';
    type = 'text/plain';
  }
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
  showToast(`Downloaded ${filename} ✓`);
}

// ============================================================
//  TOAST
// ============================================================
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}

// Load TTS voices
window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };

// Initial greeting
window.addEventListener('load', () => {
  setTimeout(() => {
    addMessage('Bot', 'Namaste! Main aapka Hindi-Telugu voice assistant hoon. Aapko kaise help kar sakta hoon? Meeku enti kavali?', true);
  }, 800);
});
